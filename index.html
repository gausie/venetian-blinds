<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venetian Blinds Demo</title>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div class="controls">
      <button type="button" data-control="up">Up</button>
      <button type="button" data-control="down">Down</button>
      <button type="button" data-control="select">Select</button>
      <button type="button" data-control="reset">Reset</button>
    </div>
    <p>Joystick up/down (arrows or W/S) raises and lowers the blinds. F1 select, F2 reset.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
